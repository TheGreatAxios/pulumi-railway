version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - gosec
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unused
  settings:
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true

formatters:
  enable:
    - gci
    - gofmt
    - goimports
