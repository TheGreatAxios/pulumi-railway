name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5.5.0
        with:
          go-version-file: provider/go.mod
          cache-dependency-path: provider/go.sum
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdk/nodejs/package-lock.json
      - uses: pulumi/setup-pulumi@v2.0.0
      - name: Install golangci-lint
        env:
          GOLANGCI_LINT_VERSION: v2.12.2
        run: |
          curl -sSfL "https://raw.githubusercontent.com/golangci/golangci-lint/${GOLANGCI_LINT_VERSION}/install.sh" \
            | sh -s -- -b "$(go env GOPATH)/bin" "${GOLANGCI_LINT_VERSION}"
          echo "$(go env GOPATH)/bin" >> "${GITHUB_PATH}"
      - name: Validate provider and generated artifacts
        env:
          VERSION: ${{ github.ref_name }}
        run: make ci VERSION="${VERSION#v}"

  publish-provider:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5.5.0
        with:
          go-version-file: provider/go.mod
          cache-dependency-path: provider/go.sum
      - uses: goreleaser/goreleaser-action@v6.2.1
        with:
          distribution: goreleaser
          version: v2.14.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: pulumi/setup-pulumi@v2.0.0
      - name: Verify release archive names and binary version
        env:
          VERSION: ${{ github.ref_name }}
        run: ./scripts/verify-release-assets.sh "${VERSION#v}"

  publish-nodejs:
    needs: [validate, publish-provider]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v5.5.0
        with:
          go-version-file: provider/go.mod
          cache-dependency-path: provider/go.sum
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: sdk/nodejs/package-lock.json
      - uses: pulumi/setup-pulumi@v2.0.0
      - name: Build exact npm artifact
        env:
          VERSION: ${{ github.ref_name }}
        run: make package-nodejs VERSION="${VERSION#v}"
      - name: Publish npm package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          version="${VERSION#v}"
          package="dist/thegreataxios-pulumi-railway-${version}.tgz"
          if [[ "${version}" == *-* ]]; then
            npm publish "${package}" --access public --provenance --tag next
          else
            npm publish "${package}" --access public --provenance
          fi
