name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-go@v5.5.0
        with:
          go-version-file: provider/go.mod
          cache-dependency-path: provider/go.sum
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdk/nodejs/package-lock.json
      - uses: pulumi/setup-pulumi@v2.0.0
      - name: Install golangci-lint
        env:
          GOLANGCI_LINT_VERSION: v2.12.2
        run: |
          curl -sSfL "https://raw.githubusercontent.com/golangci/golangci-lint/${GOLANGCI_LINT_VERSION}/install.sh" \
            | sh -s -- -b "$(go env GOPATH)/bin" "${GOLANGCI_LINT_VERSION}"
          echo "$(go env GOPATH)/bin" >> "${GITHUB_PATH}"
      - name: Validate provider, generated artifacts, and SDK
        run: make ci VERSION=0.0.0-dev
      - name: Verify GoReleaser snapshot
        uses: goreleaser/goreleaser-action@v7.2.3
        with:
          distribution: goreleaser
          version: v2.14.0
          args: release --snapshot --clean
      - name: Verify release archive names and binary version
        run: ./scripts/verify-release-assets.sh
