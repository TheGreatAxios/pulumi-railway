name: Publish npm

# Manual follow-up to the Release workflow: run this after a v*.*.* tag's
# GitHub release exists to publish the matching npm package on demand.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish-nodejs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ inputs.tag }}
      - name: Guard tag format
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "invalid release tag: ${TAG}" >&2
            exit 1
          fi
      - uses: actions/setup-go@v5.5.0
        with:
          go-version-file: provider/go.mod
          cache-dependency-path: provider/go.sum
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: sdk/nodejs/package-lock.json
      - uses: pulumi/setup-pulumi@v2.0.0
      - name: Build exact npm artifact
        env:
          TAG: ${{ inputs.tag }}
        run: make package-nodejs VERSION="${TAG#v}"
      - name: Publish npm package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          version="${TAG#v}"
          package="dist/thegreataxios-pulumi-railway-${version}.tgz"
          if [[ "${version}" == *-* ]]; then
            npm publish "${package}" --access public --provenance --tag next
          else
            npm publish "${package}" --access public --provenance
          fi
